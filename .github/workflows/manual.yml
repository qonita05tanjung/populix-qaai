name: Manual

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write         
  id-token: write      

env:
  TZ: Asia/Jakarta

jobs:
  run-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      
      - name: Run web:login
        id: web_login
        run: npm run web:login
        continue-on-error: true

      - name: Run web:mov_rec
        id: web_mov_rec
        run: npm run web:mov_rec
        continue-on-error: true

      - name: Generate Allure report
        id: allure_generate
        run: npm run allure:generate
        continue-on-error: true

      - name: Run eval:matrics (mochawesome)
        id: eval_matrics
        run: npm run eval:matrics
        continue-on-error: true

     
      - name: Merge mochawesome JSON
        run: |
          if [ -d reports ]; then
            npm run report:merge || true
            npm run report:html || true
          fi

      
      - name: Prepare site folder
        run: |
          set -e
          RUN_DIR="runs/${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p "site/${RUN_DIR}"

          if [ -d allure-report ]; then
            mkdir -p "site/${RUN_DIR}/allure"
            cp -r allure-report/* "site/${RUN_DIR}/allure/"
          fi

          if [ -d reports ]; then
            mkdir -p "site/${RUN_DIR}/mochawesome"
            cp -r reports/* "site/${RUN_DIR}/mochawesome/"
          fi

          rm -rf site/latest
          mkdir -p site/latest
          if [ -d "site/${RUN_DIR}/allure" ]; then
            mkdir -p site/latest/allure
            cp -r "site/${RUN_DIR}/allure/"* site/latest/allure/
          fi
          if [ -d "site/${RUN_DIR}/mochawesome" ]; then
            mkdir -p site/latest/mochawesome
            cp -r "site/${RUN_DIR}/mochawesome/"* site/latest/mochawesome/
          fi

          cat > site/index.html <<'HTML'
          <!doctype html>
          <meta http-equiv="refresh" content="0; url=./latest/">
          <title>Redirecting…</title>
          <a href="./latest/">Go to latest report</a>
          HTML

          mkdir -p site/latest
          cat > site/latest/index.html <<'HTML'
          <!doctype html>
          <h2>Test Reports (Latest)</h2>
          <ul>
            <li><a href="./allure/index.html">Allure Report</a></li>
            <li><a href="./mochawesome/mocha-report.html">Mochawesome Report</a></li>
          </ul>
          <p><a href="../">See archive</a></p>
          HTML

          cat > site/README.html <<'HTML'
          <!doctype html>
          <h2>Reports Archive</h2>
          <p><a href="./latest/">Latest</a></p>
          <ul>
          HTML
          for d in $(ls -1 site/runs | sort -Vr); do
            echo "<li><a href=\"./runs/$d/\">$d</a></li>" >> site/README.html
          done
          echo "</ul>" >> site/README.html

          cat > site/runs/index.html <<'HTML'
          <!doctype html>
          <h2>Runs</h2>
          <ul>
          HTML
          for d in $(ls -1 site/runs | sort -Vr); do
            echo "<li><a href=\"./$d/\">$d</a></li>" >> site/runs/index.html
          done
          echo "</ul>" >> site/runs/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  generate-report:
    needs: run-e2e
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
